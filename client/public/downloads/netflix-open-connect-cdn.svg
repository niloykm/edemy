<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" style="background:#0f172a; font-family:system-ui, -apple-system, sans-serif;">
  <text x="50" y="50" fill="#f8fafc" font-size="24" font-weight="bold">Netflix Open Connect Appliance (OCA) Global CDN Architecture</text>
