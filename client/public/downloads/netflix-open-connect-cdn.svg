  <rect x="50" y="120" width="260" height="480" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="180" y="160" fill="#f43f5e" font-size="18" font-weight="bold" text-anchor="middle">AWS Control Plane</text>
  <text x="180" y="190" fill="#94a3b8" font-size="12" text-anchor="middle">Proactive Manifest Steering</text>
  <rect x="370" y="120" width="260" height="480" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="500" y="160" fill="#e11d48" font-size="18" font-weight="bold" text-anchor="middle">Tier-1 ISP OCA Cache</text>
  <text x="500" y="190" fill="#94a3b8" font-size="12" text-anchor="middle">100 Gbps Local Flash Buffer</text>
  <rect x="690" y="120" width="260" height="480" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="820" y="160" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">End-User Playback</text>
  <text x="820" y="190" fill="#94a3b8" font-size="12" text-anchor="middle">Adaptive Bitrate (HLS/DASH)</text>
