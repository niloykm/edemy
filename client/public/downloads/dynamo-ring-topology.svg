<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" style="background:#0f172a; font-family:system-ui, -apple-system, sans-serif;">
  <text x="50" y="60" fill="#f8fafc" font-size="24" font-weight="bold">Dynamo Ring Topology &amp; Consistent Hashing</text>
  <text x="50" y="90" fill="#94a3b8" font-size="14">Virtual Nodes, Token Rings &amp; Sloppy Quorums (N=3, R=2, W=2)</text>
  <circle cx="500" cy="430" r="240" fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="12,12"/>
  
  <!-- Nodes on Ring -->
  <circle cx="500" cy="190" r="32" fill="#6366f1" stroke="#a5b4fc" stroke-width="3"/>
  <text x="500" y="197" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">Node A</text>
  
  <circle cx="730" cy="350" r="32" fill="#ec4899" stroke="#fbcfe8" stroke-width="3"/>
  <text x="730" y="357" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">Node B</text>

  <circle cx="640" cy="620" r="32" fill="#10b981" stroke="#a7f3d0" stroke-width="3"/>
  <text x="640" y="627" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">Node C</text>

  <circle cx="360" cy="620" r="32" fill="#f59e0b" stroke="#fde68a" stroke-width="3"/>
  <text x="360" y="627" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">Node D</text>

  <circle cx="270" cy="350" r="32" fill="#8b5cf6" stroke="#ddd6fe" stroke-width="3"/>
  <text x="270" y="357" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">Node E</text>

  <text x="500" y="435" fill="#cbd5e1" font-size="16" font-weight="bold" text-anchor="middle">Key Space: [0, 2^64 - 1]</text>
  <text x="500" y="460" fill="#64748b" font-size="12" text-anchor="middle">256 Virtual Nodes per Physical Host</text>
</svg>